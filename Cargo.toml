[package]
name = "iphoto-sifter"
version = "0.1.0"
edition = "2021"
authors = ["Photo Library Sifter Contributors"]
description = "CLI tool to sync photos from directories into Photos.app libraries"
license = "MIT"

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# File system operations
walkdir = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Database access
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = "0.4"

# Progress indicators and terminal output
indicatif = "0.17"
colored = "2.1"

# UUID generation for Photos.app
uuid = { version = "1.10", features = ["v4"] }

[lib]
name = "iphoto_sifter"
path = "src/lib.rs"

[[bin]]
name = "iphoto-sifter"
path = "src/main.rs"
